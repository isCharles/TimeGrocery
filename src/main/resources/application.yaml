server:
  port: ${HMDP_SERVER_PORT:8081}
spring:
  application:
    name: hmdp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${HMDP_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${HMDP_MYSQL_USERNAME:root}
    password: ${HMDP_MYSQL_PASSWORD:}
  redis:
    host: ${HMDP_REDIS_HOST:localhost}
    port: ${HMDP_REDIS_PORT:6379}
    password: ${HMDP_REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.hmdp.entity
logging:
  level:
    com.hmdp: debug
rocketmq:
  name-server: ${HMDP_ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${HMDP_ROCKETMQ_PRODUCER_GROUP:hmdp-seckill-producer}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
